# Site-drift check: the version table in src/data/site.ts vs the live
# registries. The refresh kept lapsing after release waves (three
# incidents) - this cron opens a drift issue the moment the site
# advertises less than what is published, mirroring teptris's
# pin-freshness lane.
#
# Since 2026-11-26 it also opens the refresh PR ITSELF (the drift
# table as the body, one merge-click to clear): the issues were the
# reminder; the PR is the fix. The branch site-drift/refresh is
# force-updated in place, so the PR updates itself as drift evolves.
name: site-drift

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: site-drift
  cancel-in-progress: false

env:
  REFRESH_BRANCH: site-drift/refresh

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare site.ts against the registries
        run: |
          set -e
          site() { grep -oP "(?<=${1}: ')[^']+" src/data/site.ts | head -1; }
          reg_gem()   { curl -s "https://rubygems.org/api/v1/versions/$1/latest.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])"; }
          gem_date()  { curl -s "https://rubygems.org/api/v2/rubygems/$1/versions/$2.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['created_at'][:10])"; }
          reg_pypi()  { curl -s "https://pypi.org/pypi/$1/json" | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])"; }
          pypi_date() { curl -s "https://pypi.org/pypi/$1/json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sorted(f['upload_time'][:10] for f in d['releases'][d['info']['version']])[-1])"; }
          reg_npm()   { npm view "$1" version; }
          npm_date()  { npm view "$1" time --json | python3 -c "import json,sys; print(json.load(sys.stdin)['$2'][:10])"; }
          reg_crates(){ curl -s -A "site-drift" "https://crates.io/api/v1/crates/$1" | python3 -c "import json,sys; print(json.load(sys.stdin)['crate']['max_stable_version'])"; }
          crates_date(){ curl -s -A "site-drift" "https://crates.io/api/v1/crates/$1" | python3 -c "import json,sys; print(json.load(sys.stdin)['crate']['updated_at'][:10])"; }
          {
            echo "stale<<DRIFT"
            check() {
              if [ "$2" != "$3" ]; then
                echo "$1: site=$2 registry=$3"
              fi
            }
            check "leptris (rubygems)" "$(site gem)"     "$(reg_gem leptris)"
            check "leptris (pypi)"     "$(site py)"      "$(reg_pypi leptris)"
            check "teptris ruby"       "$(site tomlRuby)" "$(reg_gem teptris)"
            check "teptris py"         "$(site tomlPy)"   "$(reg_pypi teptris)"
            check "teptris ts (npm)"   "$(site tomlJs)"   "$(reg_npm teptris)"
            check "teptris rs (crates)" "$(site tomlRs)"  "$(reg_crates teptris)"
            echo "DRIFT"
          } > drift.txt
          cat drift.txt
          echo "HAS_DRIFT=$(grep -c ': site=' drift.txt || true)" >> "$GITHUB_ENV"

      # The refresh PR: apply the registry truth to site.ts (versions +
      # release dates) and open/update site-drift/refresh. One merge
      # click clears the drift; the PR body carries the table that
      # justified it.
      - name: Open or update the refresh PR
        if: env.HAS_DRIFT != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python3 - <<'PY'
          import json, re, subprocess, urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "site-drift"})
              return json.load(urllib.request.urlopen(req, timeout=30))

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True, check=True).stdout.strip()

          gem = get("https://rubygems.org/api/v1/versions/leptris/latest.json")["version"]
          gem_date = get(f"https://rubygems.org/api/v2/rubygems/leptris/versions/{gem}.json")["created_at"][:10]
          pypi = get("https://pypi.org/pypi/leptris/json")
          py = pypi["info"]["version"]
          py_date = sorted(f["upload_time"][:10] for f in pypi["releases"][py])[-1]
          tg = get("https://rubygems.org/api/v1/versions/teptris/latest.json")["version"]
          tg_date = get(f"https://rubygems.org/api/v2/rubygems/teptris/versions/{tg}.json")["created_at"][:10]
          tp = get("https://pypi.org/pypi/teptris/json")
          tpy = tp["info"]["version"]
          tpy_date = sorted(f["upload_time"][:10] for f in tp["releases"][tpy])[-1]
          tjs = sh("npm", "view", "teptris", "version")
          tjs_date = json.loads(sh("npm", "view", "teptris", "time", "--json"))[tjs][:10]
          tc = get("https://crates.io/api/v1/crates/teptris")["crate"]
          trs, trs_date = tc["max_stable_version"], tc["updated_at"][:10]

          updates = {
              "gem": (gem, gem_date), "py": (py, py_date),
              "tomlRuby": (tg, tg_date), "tomlPy": (tpy, tpy_date),
              "tomlJs": (tjs, tjs_date), "tomlRs": (trs, trs_date),
          }
          src = open("src/data/site.ts").read()
          for key, (ver, date) in updates.items():
              src = re.sub(rf"(?m)^(\s*{key}: ')[^']*(',)$", rf"\g<1>{ver}\2", src)
              src = re.sub(rf"(?m)^(\s*{key}Date: ')[^']*(',)$", rf"\g<1>{date}\2", src)
          open("src/data/site.ts", "w").write(src)
          PY

          if git diff --quiet src/data/site.ts; then
            echo "no content delta after rewrite; nothing to PR"
            exit 0
          fi

          git config user.name "site-drift bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$REFRESH_BRANCH" 2>/dev/null || git checkout "$REFRESH_BRANCH"
          git commit -am "fix(site): the version table rides the registries (drift bot)" || true

          # force-update the fixed branch so the PR evolves with drift
          git push -f origin "$REFRESH_BRANCH"

          DRIFT_TABLE=$(cat drift.txt)
          BODY="The drift cron computed this table and opened this PR with the fix applied - merge to clear:

          \`\`\`
          $DRIFT_TABLE
          \`\`\`

          site.ts rows updated to the live registries (versions + release dates). Companion to the site-drift issue; this PR is the refresh."

          EXISTING=$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$BODY"
          else
            gh pr create --base main --head "$REFRESH_BRANCH" \
              --title "fix(site): the version table rides the registries (drift bot)" \
              --body "$BODY"
          fi

      - name: Open or update the drift issue
        if: env.HAS_DRIFT != '0'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const drift = fs.readFileSync('drift.txt', 'utf8').trim();
            const body = 'The site version table lags the registries:\n\n```\n'
              + drift + '\n```\n\n'
              + 'The refresh PR (branch `site-drift/refresh`) carries the fix - merge it to clear this issue. '
              + 'Opened by the site-drift cron.';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'site-drift',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'site.ts version table lags the registries',
                body, labels: ['site-drift'],
              });
            }
