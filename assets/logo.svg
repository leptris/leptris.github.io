<?xml version="1.0" encoding="UTF-8"?>
<!-- leptris master mark — the three-hares rotor.
     One unit (head + chamfered ear + body arc + speed streak) under
     exact 120-degree rotations: the mark is isomorphic to itself
     under C3 by construction (single defs unit, two use rotations).
     Geometry generated parametrically — arcs and lines only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="leptris — three hares rotor">
  <defs>
    <g id="leptris-hare">
      <circle cx="101.95" cy="44.03" r="15"/>
      <path d="M 91.16,37.27 L 85.26,21.23 L 76.04,23.53 L 78.35,40.47 Z"/>
      <path d="M 115.99,44.25 A 58.00,58.00 0 0 1 150.73,71.88" fill="none" stroke-width="25" stroke-linecap="round" class="body"/>
      <path d="M 164.86,71.12 A 71.00,71.00 0 0 1 168.25,80.43" fill="none" stroke-width="4.5" stroke-linecap="round" class="body"/>
      <circle class="eye" cx="95.25" cy="39.59" r="2.4"/>
    </g>
  </defs>
  <circle cx="100" cy="100" r="93" fill="none" stroke-width="2" class="ring"/>
  <use href="#leptris-hare"/>
  <use href="#leptris-hare" transform="rotate(120 100 100)"/>
  <use href="#leptris-hare" transform="rotate(240 100 100)"/>
</svg>
